<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    
<form id="signupForm" method="POST">

  <label for="first_name">First Name</label><br>
  <input type="text" id="first_name" placeholder="Enter first name" required><br><br>

  <label for="last_name">Last Name</label><br>
  <input type="text" id="last_name" placeholder="Enter last name" required><br><br>

  <label for="email">Email</label><br>
  <input type="email" id="email" placeholder="Enter email" required><br><br>

  <label for="phone">Phone</label><br>
  <input type="text" id="phone" placeholder="Enter phone number" required><br><br>

  <label for="password">Password</label><br>
  <input type="password" id="password" placeholder="Enter password" required><br><br>

  <button type="submit">Sign Up</button>

</form>


<script>
document.getElementById("signupForm").addEventListener("submit", async function(e) {e.preventDefault();

    const data = {
        first_name: document.getElementById("first_name").value,
        last_name: document.getElementById("last_name").value,
        email: document.getElementById("email").value,
        phone: document.getElementById("phone").value,
        password: document.getElementById("password").value
    };

    try {
        const response = await fetch("/token/api/signup/",
         {
            method: "POST",
            headers: {"Content-Type": "application/json"},
            body: JSON.stringify(data)
        });

        const result = await response.json();
        // 🔥 redirect (optional)
            window.location.href = "{% url 'login1' %}";

        if (response.ok) {
            alert("Signup successful 🎉");
        } else {
            console.log(result);
            alert("Error: " + JSON.stringify(result));
        }

    } catch (error) {
        console.error("Error:", error);
    }
});
</script>




</body>
</html>
