<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Login</title>
  <link href="https://fonts.googleapis.com/css2?family=Syne:wght@400;600;700;800&family=DM+Sans:wght@300;400;500&display=swap" rel="stylesheet"/>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    :root {
      --c1: #ff6b6b;
      --c2: #ffd93d;
      --c3: #6bcb77;
      --c4: #4d96ff;
      --c5: #c77dff;
      --dark: #0f0f13;
      --card: #18181f;
      --border: rgba(255,255,255,0.08);
      --text: #f0f0f0;
      --muted: #888;
      --font-head: 'Syne', sans-serif;
      --font-body: 'DM Sans', sans-serif;
    }

    body {
      background: var(--dark);
      color: var(--text);
      font-family: var(--font-body);
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      overflow: hidden;
      position: relative;
    }

    .blob {
      position: fixed;
      border-radius: 50%;
      filter: blur(80px);
      opacity: 0.18;
      animation: floatBlob 8s ease-in-out infinite;
      pointer-events: none;
    }
    .blob-1 { width: 400px; height: 400px; background: var(--c4); top: -100px; right: -100px; animation-delay: 0s; }
    .blob-2 { width: 350px; height: 350px; background: var(--c5); bottom: -80px; left: -80px; animation-delay: 2s; }

    @keyframes floatBlob {
      0%, 100% { transform: translate(0, 0) scale(1); }
      50% { transform: translate(20px, -20px) scale(1.05); }
    }

    .page-wrap {
      width: 100%;
      max-width: 420px;
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: 24px;
      padding: 50px 44px;
      position: relative;
      z-index: 1;
      margin: 20px;
      box-shadow: 0 40px 100px rgba(0,0,0,0.6);
    }

    .brand {
      font-family: var(--font-head);
      font-size: 13px;
      font-weight: 700;
      letter-spacing: 3px;
      text-transform: uppercase;
      color: var(--c4);
      margin-bottom: 32px;
      display: block;
    }

    .form-title {
      font-family: var(--font-head);
      font-size: 32px;
      font-weight: 800;
      margin-bottom: 6px;
    }

    .form-title span {
      background: linear-gradient(90deg, var(--c4), var(--c5));
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
    }

    .form-subtitle {
      font-size: 14px;
      color: var(--muted);
      margin-bottom: 36px;
    }

    .form-group {
      display: flex;
      flex-direction: column;
      gap: 7px;
      margin-bottom: 18px;
    }

    .form-group label {
      font-size: 12px;
      font-weight: 500;
      letter-spacing: 0.5px;
      color: #aaa;
      text-transform: uppercase;
    }

    .form-group input {
      background: rgba(255,255,255,0.04);
      border: 1px solid var(--border);
      border-radius: 10px;
      padding: 13px 16px;
      font-size: 14px;
      font-family: var(--font-body);
      color: var(--text);
      outline: none;
      transition: border-color 0.2s, background 0.2s;
    }

    .form-group input:focus {
      border-color: var(--c4);
      background: rgba(77,150,255,0.06);
    }

    .form-group input::placeholder { color: #444; }

    .btn-login {
      width: 100%;
      padding: 14px;
      border-radius: 10px;
      border: none;
      background: linear-gradient(90deg, var(--c4), var(--c5));
      color: #fff;
      font-family: var(--font-head);
      font-size: 15px;
      font-weight: 700;
      cursor: pointer;
      transition: opacity 0.2s, transform 0.1s;
      margin-top: 6px;
      letter-spacing: 0.5px;
    }

    .btn-login:hover { opacity: 0.9; transform: translateY(-1px); }
    .btn-login:active { transform: translateY(0); }
    .btn-login:disabled { opacity: 0.5; cursor: not-allowed; }

    .signup-link {
      text-align: center;
      margin-top: 24px;
      font-size: 13px;
      color: var(--muted);
    }

    .signup-link a {
      color: var(--c4);
      text-decoration: none;
      font-weight: 500;
    }

    .signup-link a:hover { text-decoration: underline; }

    .msg {
      padding: 12px 16px;
      border-radius: 10px;
      font-size: 13px;
      margin-bottom: 16px;
      display: none;
    }
    .msg.error { background: rgba(255,107,107,0.12); border: 1px solid rgba(255,107,107,0.3); color: var(--c1); display: block; }
    .msg.success { background: rgba(107,203,119,0.12); border: 1px solid rgba(107,203,119,0.3); color: var(--c3); display: block; }
  </style>
</head>
<body>
  <div class="blob blob-1"></div>
  <div class="blob blob-2"></div>

  <div class="page-wrap">
    <span class="brand">◆ MyApp</span>
    <div class="form-title">Welcome <span>back</span></div>
    <div class="form-subtitle">Login to your account</div>

    <div id="msg" class="msg"></div>

    <form id="loginForm">
      {% csrf_token %}
      <div class="form-group">
        <label>Email</label>
        <input type="email" id="email" placeholder="john@example.com" required/>
      </div>

      <div class="form-group">
        <label>Password</label>
        <input type="password" id="password" placeholder="Your password" required/>
      </div>

      <button type="submit" class="btn-login" id="submitBtn">Login</button>
    </form>

    <div class="signup-link">
      Don't have an account? <a href="{% url 'signup' %}">Sign up</a>
    </div>
  </div>

  <script>
    document.getElementById('loginForm').addEventListener('submit', async function(e) {
      e.preventDefault();

      const msg = document.getElementById('msg');
      msg.className = 'msg';
      msg.textContent = '';

      const btn = document.getElementById('submitBtn');
      btn.disabled = true;
      btn.textContent = 'Logging in...';

      const data = {
        email:    document.getElementById('email').value,
        password: document.getElementById('password').value,
      };

      try {
        const res = await fetch('/profiles/api/login/', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json', 'X-CSRFToken': getCookie('csrftoken') },
          body: JSON.stringify(data)
        });

        const result = await res.json();

        if (res.ok) {
          // Token localStorage mein save karo (cookie backend mein set ho jaayegi)
          localStorage.setItem('access_token', result.access);
          localStorage.setItem('refresh_token', result.refresh);

          msg.className = 'msg success';
          msg.textContent = 'Login successful! Redirecting...';
          setTimeout(() => window.location.href = "{% url 'dashboard' %}", 1200);
        } else {
          msg.className = 'msg error';
          msg.textContent = result.error || result.detail || 'Invalid email or password';
        }
      } catch(err) {
        msg.className = 'msg error';
        msg.textContent = 'Network error. Please try again.';
      }

      btn.disabled = false;
      btn.textContent = 'Login';
    });

    function getCookie(name) {
      const val = `; ${document.cookie}`;
      const parts = val.split(`; ${name}=`);
      if (parts.length === 2) return parts.pop().split(';').shift();
    }
  </script>
</body>
</html>
