<!DOCTYPE html>
<html>
<head>
    <title>{{ room_name }} - Django Chat</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }

        body {
            font-family: Arial, sans-serif;
            background: #f0f2f5;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
        }

        .chat-container {
            width: 450px;
            background: white;
            border-radius: 12px;
            box-shadow: 0 4px 20px rgba(0,0,0,0.1);
            overflow: hidden;
        }

        .chat-header {
            background: #075e54;
            color: white;
            padding: 16px 20px;
        }

        .chat-header h3 { font-size: 18px; }
        .chat-header span { font-size: 12px; opacity: 0.8; }

        .chat-messages {
            height: 400px;
            overflow-y: auto;
            padding: 16px;
            display: flex;
            flex-direction: column;
            gap: 8px;
            background: #e5ddd5;
        }

        .message-wrapper {
            display: flex;
            flex-direction: column;
        }

        .message-wrapper.mine { align-items: flex-end; }
        .message-wrapper.others { align-items: flex-start; }
        .message-wrapper.system { align-items: center; }

        .message-username {
            font-size: 11px;
            color: #666;
            margin-bottom: 2px;
            padding: 0 4px;
        }

        .message {
            max-width: 75%;
            padding: 8px 12px;
            border-radius: 8px;
            font-size: 14px;
            line-height: 1.4;
            word-wrap: break-word;
        }

        .mine .message {
            background: #dcf8c6;
            border-bottom-right-radius: 2px;
        }

        .others .message {
            background: white;
            border-bottom-left-radius: 2px;
        }

        .system .message {
            background: rgba(0,0,0,0.1);
            font-size: 12px;
            color: #555;
            border-radius: 12px;
            padding: 4px 12px;
        }

        .chat-input {
            display: flex;
            padding: 12px;
            gap: 10px;
            background: #f0f0f0;
        }

        .chat-input input {
            flex: 1;
            padding: 10px 14px;
            border: none;
            border-radius: 20px;
            font-size: 14px;
            outline: none;
        }

        .chat-input button {
            padding: 10px 20px;
            background: #075e54;
            color: white;
            border: none;
            border-radius: 20px;
            cursor: pointer;
        }

        .chat-input button:hover { background: #128c7e; }
    </style>
</head>
<body>

<div class="chat-container">
    <div class="chat-header">
        <h3>💬 {{ room_name }}</h3>
        <span>Logged in as: {{ username }}</span>
    </div>

    <div id="messages" class="chat-messages"></div>

    <div class="chat-input">
        <input
            type="text"
            id="messageInput"
            placeholder="Type a message..."
            onkeypress="handleKeyPress(event)"
        />
        <button onclick="sendMessage()">Send</button>
    </div>
</div>

<script>
    const roomName = "{{ room_name }}";
    const username = "{{ username }}";

    // Connect with room and username in URL
    const ws = new WebSocket(`ws://127.0.0.1:8000/ws/chat/${roomName}/${username}/`);

    const messagesDiv = document.getElementById('messages');
    const input = document.getElementById('messageInput');

    ws.onmessage = (e) => {
        const data = JSON.parse(e.data);
        addMessage(data.message, data.username, data.is_system);
    };

    ws.onclose = () => {
        addMessage('Connection lost. Please refresh.', '🔔 System', true);
    };

    function addMessage(text, msgUsername, isSystem) {
        const wrapper = document.createElement('div');
        wrapper.classList.add('message-wrapper');

        if (isSystem) {
            wrapper.classList.add('system');
        } else if (msgUsername === username) {
            wrapper.classList.add('mine');      // 👈 my messages → right side
        } else {
            wrapper.classList.add('others');    // 👈 others → left side
        }

        // Show username label (not for system or own messages)
        if (!isSystem && msgUsername !== username) {
            const nameDiv = document.createElement('div');
            nameDiv.classList.add('message-username');
            nameDiv.textContent = msgUsername;
            wrapper.appendChild(nameDiv);
        }

        const msgDiv = document.createElement('div');
        msgDiv.classList.add('message');
        msgDiv.textContent = text;
        wrapper.appendChild(msgDiv);

        messagesDiv.appendChild(wrapper);
        messagesDiv.scrollTop = messagesDiv.scrollHeight;
    }

    function sendMessage() {
        const message = input.value.trim();
        if (!message) return;
        ws.send(JSON.stringify({ message: message }));
        input.value = '';
    }

    function handleKeyPress(event) {
        if (event.key === 'Enter') sendMessage();
    }
</script>

</body>
</html>
