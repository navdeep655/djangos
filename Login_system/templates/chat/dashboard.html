<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>Dashboard</title>

    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap"
          rel="stylesheet">

    <style>

        *{
            margin:0;
            padding:0;
            box-sizing:border-box;
        }

        body{

            font-family:'Poppins', sans-serif;

            min-height:100vh;

            background:
                linear-gradient(
                    135deg,
                    #0f172a,
                    #1e293b,
                    #334155
                );

            display:flex;

            justify-content:center;

            align-items:center;

            padding:30px;

            position:relative;

            overflow-x:hidden;
        }

        body::before{

            content:"";

            position:absolute;

            width:400px;
            height:400px;

            background:#38bdf8;

            border-radius:50%;

            top:-150px;
            left:-150px;

            filter:blur(120px);

            opacity:0.35;
        }

        body::after{

            content:"";

            position:absolute;

            width:400px;
            height:400px;

            background:#8b5cf6;

            border-radius:50%;

            bottom:-150px;
            right:-150px;

            filter:blur(120px);

            opacity:0.35;
        }

        .dashboard-container{

            width:100%;
            max-width:760px;

            background:rgba(255,255,255,0.08);

            backdrop-filter:blur(18px);

            border:1px solid rgba(255,255,255,0.1);

            border-radius:24px;

            padding:35px;

            position:relative;

            z-index:10;

            box-shadow:
                0 20px 45px rgba(0,0,0,0.35);
        }

        .top-bar{

            display:flex;

            justify-content:space-between;

            align-items:center;

            margin-bottom:30px;
        }

        .welcome h1{

            color:white;

            font-size:30px;

            margin-bottom:5px;
        }

        .welcome p{

            color:#cbd5e1;

            font-size:14px;
        }

        .logout-btn{

            text-decoration:none;

            padding:12px 20px;

            border-radius:12px;

            background:#ef4444;

            color:white;

            font-weight:600;

            transition:0.3s;
        }

        .logout-btn:hover{

            background:#dc2626;

            transform:translateY(-2px);
        }

        #success{

            margin-bottom:20px;

            color:#4ade80;

            font-weight:500;
        }

        .btn-group{

            display:flex;

            gap:15px;

            margin-bottom:30px;
        }

        .action-btn{

            flex:1;

            padding:15px;

            border:none;

            border-radius:14px;

            background:
                linear-gradient(
                    135deg,
                    #38bdf8,
                    #8b5cf6
                );

            color:white;

            font-size:15px;

            font-weight:600;

            cursor:pointer;

            transition:0.3s;
        }

        .action-btn:hover{

            transform:translateY(-3px);

            box-shadow:
                0 10px 25px rgba(56,189,248,0.35);
        }

        .search-box{

            display:none;

            margin-bottom:25px;
        }

        .search-box input{

            width:100%;

            padding:15px;

            border:none;

            border-radius:14px;

            background:rgba(255,255,255,0.08);

            color:white;

            outline:none;

            font-size:15px;
        }

        .search-box input::placeholder{

            color:#cbd5e1;
        }

        .rooms-title{

            color:white;

            margin-bottom:20px;

            font-size:22px;
        }

        .room-list{

            display:flex;

            flex-direction:column;

            gap:15px;
        }

        .room-card{

            display:flex;

            justify-content:space-between;

            align-items:center;

            padding:18px 20px;

            border-radius:16px;

            background:rgba(255,255,255,0.07);

            border:1px solid rgba(255,255,255,0.08);

            transition:0.3s;
        }

        .room-card:hover{

            transform:translateY(-3px);

            background:rgba(255,255,255,0.12);
        }

        .room-name{

            color:white;

            font-size:18px;

            font-weight:600;
        }

        .room-actions{

            display:flex;

            gap:10px;
        }

        .join-btn{

            padding:10px 16px;

            border:none;

            border-radius:10px;

            background:#22c55e;

            color:white;

            cursor:pointer;

            font-weight:600;

            transition:0.3s;
        }

        .join-btn:hover{

            background:#16a34a;
        }

        .delete-btr{

            padding:10px 16px;

            border:none;

            border-radius:10px;

            background:#ef4444;

            color:white;

            cursor:pointer;

            font-weight:600;

            transition:0.3s;
        }

        .delete-btr:hover{

            background:#dc2626;
        }

        .modal{

            display:none;

            position:fixed;

            top:0;
            left:0;

            width:100%;
            height:100%;

            background:rgba(0,0,0,0.7);

            justify-content:center;

            align-items:center;

            z-index:999;
        }

        .modal-content{

            width:400px;

            background:#1e293b;

            border-radius:20px;

            padding:30px;
        }

        .modal-content h2{

            color:white;

            margin-bottom:20px;
        }

        .modal-content input{

            width:100%;

            padding:14px;

            border:none;

            border-radius:12px;

            margin-bottom:18px;

            outline:none;

            font-size:15px;
        }

        .modal-buttons{

            display:flex;

            gap:12px;
        }

        .modal-btn{

            flex:1;

            padding:13px;

            border:none;

            border-radius:12px;

            cursor:pointer;

            font-weight:600;

            transition:0.3s;
        }

        .create-btn{

            background:#38bdf8;

            color:white;
        }

        .cancel-btn{

            background:#475569;

            color:white;
        }

        @media(max-width:700px){

            .dashboard-container{

                padding:25px;
            }

            .top-bar{

                flex-direction:column;

                align-items:flex-start;

                gap:15px;
            }

            .btn-group{

                flex-direction:column;
            }

            .room-card{

                flex-direction:column;

                align-items:flex-start;

                gap:15px;
            }

            .room-actions{

                width:100%;

                flex-direction:column;
            }

            .join-btn,
            .delete-btr{

                width:100%;
            }

            .modal-content{

                width:92%;
            }
        }

    </style>

</head>

<body>

<div class="dashboard-container">

    <div class="top-bar">

        <div class="welcome">

            <h1>
                Welcome, {{ user.username }} 👋
            </h1>

            <p>
                Manage your rooms easily
            </p>

        </div>

        <a href="#"
           class="logout-btn"
           id="logout-btn">

            Logout

        </a>

    </div>

    <p id="success"></p>

    <div class="btn-group">

        <button class="action-btn"
                id="createRoomBtn">

            ➕ Create Room

        </button>

        <button class="action-btn"
                id="searchRoomBtn">

            🔍 Search Room

        </button>

    </div>

    <div class="search-box"
         id="searchBox">

        <input type="text"
               id="searchInput"
               placeholder="Search room...">

    </div>

    <h2 class="rooms-title">

        Your Rooms

    </h2>

    <div class="room-list"
         id="roomList">

        {% for room in rooms %}

        <div class="room-card">

            <div class="room-name">

                {{ room.name }}

            </div>

            <div class="room-actions">

                <button class="join-btn"
                        data-id="{{ room.id }}">

                    Join

                </button>

                <button class="delete-btr"
                        data-id="{{ room.id }}">

                    Delete Room

                </button>

            </div>

        </div>

      {% empty %}

        <div class="room-card empty-room">

            <div class="room-name">

                No rooms found 😔

            </div>

        </div>

        {% endfor %}

    </div>

</div>


<!-- MODAL -->

<div class="modal"
     id="roomModal">

    <div class="modal-content">

        <h2>Create Room</h2>

        <input type="text"
               id="roomName"
               placeholder="Enter room name">

        <input type="number"
               id="maxMembers"
               placeholder="Max members"
               min="2">

        <div class="modal-buttons">

            <button class="modal-btn create-btn"
                    id="saveRoomBtn">

                Create

            </button>

            <button class="modal-btn cancel-btn"
                    id="closeModalBtn">

                Cancel

            </button>

        </div>

    </div>

</div>


<script>

const createBtn = document.getElementById("createRoomBtn");
const modal = document.getElementById("roomModal");
const closeBtn = document.getElementById("closeModalBtn");
const saveBtn = document.getElementById("saveRoomBtn");

const roomInput = document.getElementById("roomName");
const maxMembersInput = document.getElementById("maxMembers");

const roomList = document.getElementById("roomList");

const searchBtn = document.getElementById("searchRoomBtn");
const searchBox = document.getElementById("searchBox");
const searchInput = document.getElementById("searchInput");

const successMsg = document.getElementById("success");


/* =========================
   OPEN MODAL
========================= */

createBtn.addEventListener("click", () => {

    modal.style.display = "flex";

});


/* =========================
   CLOSE MODAL
========================= */

closeBtn.addEventListener("click", () => {

    modal.style.display = "none";

});


/* =========================
   CREATE ROOM
========================= */

saveBtn.addEventListener("click", function(e){

    e.preventDefault();

    let room_name = roomInput.value.trim();

    let val = maxMembersInput.value;

    if(room_name === ""){

        alert("Please enter room name");

        return;
    }

    fetch("http://127.0.0.1:8000/chat/room/api/",{

        method:"POST",

        headers:{
            "Content-Type":"application/json"
        },

        credentials:"include",

        body: JSON.stringify({
        name: room_name,        
        max_members: val        
        })

    })

    .then(response => response.json())

    .then(function(data){

        successMsg.innerText =
            data.message || "Room created successfully";

        /* ✅ FIX 1: Modal close karo after room create */
        modal.style.display = "none";

        const roomId = data.room_id || "";

        let div = document.createElement("div");

        div.className = "room-card";

        div.innerHTML = `

            <div class="room-name">

                ${room_name}

            </div>

            <div class="room-actions">

                <button class="join-btn"
                        data-id="${roomId}">

                    Join

                </button>

                <button class="delete-btr"
                        data-id="${roomId}">

                    Delete Room

                </button>

            </div>

        `;

        let emptyCard =
            roomList.querySelector(".empty-room");

        if(emptyCard){

            emptyCard.remove();

        }

        roomList.prepend(div);

        /* Attach events to new card's buttons */
        attachDeleteEvent(
            div.querySelector(".delete-btr")
        );

        attachJoinEvent(
            div.querySelector(".join-btn")
        );

        roomInput.value = "";
        maxMembersInput.value = "";

        /* Auto clear success message after 3s */
        setTimeout(() => {
            successMsg.innerText = "";
        }, 3000);

    })

    .catch(function(error){

        console.log(error);

        alert("Something went wrong");

    });

});


/* =========================
   SEARCH TOGGLE
========================= */

searchBtn.addEventListener("click", function () {

    if(searchBox.style.display === "block"){

        searchBox.style.display = "none";

        /* ✅ FIX 2: Jab search band ho to original rooms wapas dikhao */
        restoreOriginalRooms();

    }

    else{

        searchBox.style.display = "block";

        searchInput.focus();

        searchInput.value = "";
    }

});


/* =========================
   SEARCH ROOM API
========================= */

searchInput.addEventListener("keyup", function () {

    let query = searchInput.value.trim();

    /* If search is cleared, show original rooms */
    if(query === ""){

        restoreOriginalRooms();

        return;
    }

    /* ✅ FIX 3: Port 8001 → 8000 */
    fetch(`http://127.0.0.1:8000/chat/searchroom/api/?name=${query}`, {

        method: "GET",

        credentials: "include"

    })

    .then(response => response.json())

    .then(function(data){

        console.log(data);

        roomList.innerHTML = "";

        let rooms = data.data;

        /* NO ROOMS FOUND */

        if(!rooms || rooms.length === 0){

            roomList.innerHTML = `

                <div class="room-card empty-room">

                    <div class="room-name">

                        No rooms found 😔

                    </div>

                </div>

            `;

            return;
        }

        /* RENDER SEARCHED ROOMS */

        rooms.forEach(function(room){

            let div = document.createElement("div");

            div.className = "room-card";

            div.innerHTML = `

                <div class="room-name">

                    ${room.name}

                </div>

                <div class="room-actions">

                    <button class="join-btn"
                            data-id="${room.id}">

                        Join

                    </button>

                    <button class="delete-btr"
                            data-id="${room.id}">

                        Delete Room

                    </button>

                </div>

            `;

            roomList.appendChild(div);

            attachDeleteEvent(
                div.querySelector(".delete-btr")
            );

            attachJoinEvent(
                div.querySelector(".join-btn")
            );

        });

    })

    .catch(function(error){

        console.log(error);

    });

});


/* =========================
   RESTORE ORIGINAL ROOMS
   (jab search clear ho)
========================= */

function restoreOriginalRooms(){

    /* Page reload se Django template se fresh rooms milenge */
    window.location.reload();

}


/* =========================
   LOGOUT
========================= */

document.getElementById("logout-btn")
.addEventListener("click", function(e){

    e.preventDefault();

    fetch("http://127.0.0.1:8000/chat/logout/api/",{

        method:"POST",

        headers:{
            "Content-Type":"application/json"
        },

        credentials:"include"

    })

    .then(response => response.json())

    .then(function(data){

        console.log(data);

        window.location.href="/chat/auth/";

    });

});


/* =========================
   DELETE FUNCTION
========================= */

function attachDeleteEvent(button){

    button.addEventListener("click", function(e){

        e.preventDefault();

        let roomId =
            this.dataset.id;

        let roomCard =
            this.closest(".room-card");

        if(!roomId){

            roomCard.remove();

            return;
        }

        fetch(`http://127.0.0.1:8000/chat/deleteroom/${roomId}/`,{

            method:"DELETE",

            credentials:"include"

        })

        .then(response => response.json())

        .then(function(data){

            console.log(data);

            roomCard.remove();

        })

        .catch(function(error){

            console.log(error);

            alert("Delete failed");

        });

    });

}


/* =========================
   JOIN FUNCTION
========================= */

function attachJoinEvent(button){

    button.addEventListener("click", function(e){

        e.preventDefault();

        let roomId = this.dataset.id;

        if(roomId){

            /* ✅ Apna join URL yahan daalo */
            fetch(`/chat/room/join/${roomId}`, {
                method: "POST",
                credentials: "include",
                headers: {
                    "Content-Type": "application/json"
                }
            })
            .then(response => response.json())
            .then(function(data){

                if(
                    data.message === "direct_enter" ||
                    data.message === "request_sent" ||
                    data.message === "request_already_sent"
                ){
                    window.location.href =
                        `/chat/room/${roomId}/`;
                    return;
                }

                alert(data.error || "Join failed");
            })
            .catch(function(error){
                console.log(error);
                alert("Join failed");
            });

        }

    });

}


/* =========================
   ATTACH EVENTS TO
   EXISTING CARDS (on load)
========================= */

document.querySelectorAll(".delete-btr")
.forEach(function(button){

    attachDeleteEvent(button);

});

document.querySelectorAll(".join-btn")
.forEach(function(button){

    attachJoinEvent(button);

});

</script>

</body>

</html>
