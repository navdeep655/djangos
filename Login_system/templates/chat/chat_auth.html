<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>chatsystem - Auth</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css"
          rel="stylesheet">

    <style>
*{
    margin:0;
    padding:0;
    box-sizing:border-box;
}

body{

    font-family:'Poppins', sans-serif;

    min-height:100vh;

    display:flex;

    justify-content:center;

    align-items:center;

    background:
        linear-gradient(
            135deg,
            #0f172a,
            #1e293b,
            #334155
        );

    overflow:hidden;

    position:relative;
}


/* BACKGROUND GLOW */

body::before{

    content:"";

    position:absolute;

    width:500px;
    height:500px;

    background:#38bdf8;

    border-radius:50%;

    top:-150px;
    left:-150px;

    filter:blur(120px);

    opacity:0.4;
}

body::after{

    content:"";

    position:absolute;

    width:450px;
    height:450px;

    background:#8b5cf6;

    border-radius:50%;

    bottom:-150px;
    right:-150px;

    filter:blur(120px);

    opacity:0.4;
}


/* MAIN CARD */

.auth-container{

    width:420px;

    background:rgba(255,255,255,0.08);

    backdrop-filter:blur(18px);

    border:1px solid rgba(255,255,255,0.15);

    border-radius:24px;

    padding:40px;

    box-shadow:
        0 15px 40px rgba(0,0,0,0.35);

    position:relative;

    z-index:2;
}


/* LOGO */

.logo{

    text-align:center;

    font-size:34px;

    font-weight:700;

    color:white;

    margin-bottom:8px;

    letter-spacing:1px;
}

.logo span{

    background:linear-gradient(
        90deg,
        #38bdf8,
        #a855f7
    );

    -webkit-background-clip:text;

    -webkit-text-fill-color:transparent;
}

.subtitle{

    text-align:center;

    color:#cbd5e1;

    margin-bottom:30px;

    font-size:15px;
}


/* TABS */

.tabs{

    display:flex;

    background:rgba(255,255,255,0.08);

    border-radius:14px;

    padding:5px;

    margin-bottom:28px;
}

.tab-btn{

    flex:1;

    border:none;

    background:transparent;

    padding:12px;

    color:#cbd5e1;

    border-radius:10px;

    font-weight:600;

    cursor:pointer;

    transition:0.3s ease;
}

.tab-btn.active{

    background:linear-gradient(
        135deg,
        #38bdf8,
        #8b5cf6
    );

    color:white;

    box-shadow:
        0 4px 15px rgba(56,189,248,0.4);
}


/* FORMS */

.form-box{

    display:none;
}

.form-box.active{

    display:block;
}


/* LABELS */

label{

    display:block;

    color:#e2e8f0;

    margin-bottom:8px;

    font-size:14px;

    font-weight:500;
}


/* INPUTS */

input{

    width:100%;

    padding:14px 16px;

    border:none;

    border-radius:14px;

    margin-bottom:18px;

    background:rgba(255,255,255,0.08);

    color:white;

    font-size:15px;

    outline:none;

    transition:0.3s;
}

input::placeholder{

    color:#94a3b8;
}

input:focus{

    background:rgba(255,255,255,0.12);

    box-shadow:
        0 0 0 2px #38bdf8;
}


/* BUTTON */

button.submit-btn{

    width:100%;

    padding:14px;

    border:none;

    border-radius:14px;

    background:linear-gradient(
        135deg,
        #38bdf8,
        #8b5cf6
    );

    color:white;

    font-size:16px;

    font-weight:600;

    cursor:pointer;

    transition:0.3s ease;

    margin-top:5px;
}

button.submit-btn:hover{

    transform:translateY(-2px);

    box-shadow:
        0 10px 25px rgba(56,189,248,0.4);
}


/* MESSAGE */

.message{

    text-align:center;

    margin-bottom:18px;

    font-weight:600;

    font-size:14px;
}


/* MOBILE */

@media(max-width:500px){

    .auth-container{

        width:92%;

        padding:28px;
    }

    .logo{

        font-size:28px;
    }
}

    </style>

</head>

<body>


<div class="auth-container">

    <!-- LOGO -->

    <div class="logo">

        <span>Chat Room</span>

    </div>

    <div class="subtitle">

        Welcome to  Chat Room App

    </div>


    <!-- TABS -->

    <div class="tabs">

        <button class="tab-btn active"
                id="login-tab">

            Login

        </button>

        <button class="tab-btn"
                id="signup-tab">

            Signup

        </button>

    </div>


    <!-- MESSAGE -->

    <p id="message"
       class="message">
    </p>


    <!-- LOGIN FORM -->

    <div id="login-form"
         class="form-box active">

        <form id="loginForm">

            <label>Username</label>

            <input type="text"
                   id="login-username"
                   placeholder="Enter username">

            <label>Password</label>

            <input type="password"
                   id="login-password"
                   placeholder="Enter password">

            <button type="submit"
                    class="submit-btn">

                Login

            </button>

        </form>

    </div>


    <!-- SIGNUP FORM -->

    <div id="signup-form"
         class="form-box">

        <form id="signupForm">

            <label>Username</label>

            <input type="text"
                   id="signup-username"
                   placeholder="Enter username">

            <label>Email</label>

            <input type="email"
                   id="signup-email"
                   placeholder="Enter email">

            <label>Password</label>

            <input type="password"
                   id="signup-password"
                   placeholder="Enter password">

            <label>Confirm Password</label>

            <input type="password"
                   id="signup-confirm"
                   placeholder="Confirm password">

            <button type="submit"
                    class="submit-btn">

                Create Account

            </button>

        </form>

    </div>

</div>


<script>


// ============================
// TAB SWITCHING
// ============================

let loginTab =
    document.getElementById("login-tab");

let signupTab =
    document.getElementById("signup-tab");

let loginFormBox =
    document.getElementById("login-form");

let signupFormBox =
    document.getElementById("signup-form");


loginTab.addEventListener("click", function(){

    loginTab.classList.add("active");

    signupTab.classList.remove("active");

    loginFormBox.classList.add("active");

    signupFormBox.classList.remove("active");

});


signupTab.addEventListener("click", function(){

    signupTab.classList.add("active");

    loginTab.classList.remove("active");

    signupFormBox.classList.add("active");

    loginFormBox.classList.remove("active");

});



// ============================
// LOGIN API
// ============================

document.getElementById("loginForm")

.addEventListener("submit", function(e){

    e.preventDefault();

    let username =
        document.getElementById(
            "login-username"
        ).value;

    let password =
        document.getElementById(
            "login-password"
        ).value;

    let message =
        document.getElementById("message");


    if(username === "" || password === ""){

        message.innerText =
            "Please fill all fields";

        message.style.color = "red";

        return;
    }


    fetch(
        "http://127.0.0.1:8000/chat/login/api/",
        {

            method:"POST",

            headers:{
                "Content-Type":"application/json"
            },

            credentials:"include",

            body:JSON.stringify({

                username:username,
                password:password

            })

        }
    )

    .then(res => res.json())

    .then(data => {

        console.log(data);

        if(data.message){

            message.innerText =
                "Login Successful ✅";

            message.style.color = "green";

            setTimeout(() => {

                window.location.href =
                    "/chat/dash/";

            }, 500);

        }

        else{

            message.innerText =
                data.error || "Login Failed";

            message.style.color = "red";

        }

    });

});



// ============================
// SIGNUP API
// ============================

document.getElementById("signupForm")

.addEventListener("submit", function(e){

    e.preventDefault();

    let username =
        document.getElementById(
            "signup-username"
        ).value;

    let email =
        document.getElementById(
            "signup-email"
        ).value;

    let password =
        document.getElementById(
            "signup-password"
        ).value;

    let confirm =
        document.getElementById(
            "signup-confirm"
        ).value;

    let message =
        document.getElementById("message");


    // VALIDATION

    if(password !== confirm){

        message.innerText =
            "Passwords do not match";

        message.style.color = "red";

        return;
    }


    if(password.length < 8){

        message.innerText =
            "Password must be at least 8 characters";

        message.style.color = "red";

        return;
    }


    fetch(
        "http://127.0.0.1:8000/chat/signup/api/",
        {

            method:"POST",

            headers:{
                "Content-Type":"application/json"
            },

            body:JSON.stringify({

                username:username,
                email:email,
                password:password

            })

        }
    )

    .then(res => res.json())

    .then(data => {

        console.log(data);

        if(data.message){

            message.innerText =
                "Account Created Successfully ✅";

            message.style.color = "green";

            // AUTO SWITCH TO LOGIN

            setTimeout(() => {

                window.location.href =
                    "/chat/dash/";

            }, 500);

        }

        else{

            message.innerText =
                data.error || "Signup Failed";

            message.style.color = "red";

        }

    });

});

</script>

</body>
</html>
