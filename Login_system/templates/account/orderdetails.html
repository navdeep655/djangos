<!DOCTYPE html>
<html>

<head>

    <title>Order Details - General Mart</title>

    <link
        href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css"
        rel="stylesheet">

</head>

<body class="bg-light">

<!-- NAVBAR -->

<nav class="navbar navbar-dark bg-dark px-4">

    <span class="navbar-brand">
        📦 Order Details
    </span>

</nav>



<div class="container mt-5">

    <!-- ORDER INFO -->

    <div class="card shadow p-4 mb-4">

        <h3 class="mb-3">

            Order Information

        </h3>

        <p>
            <strong>Order ID:</strong>
            <span id="order-id"></span>
        </p>

        <p>
            <strong>Status:</strong>
            <span id="order-status"></span>
        </p>

        <p>
            <strong>Total Amount:</strong>
            ₹<span id="total-amount"></span>
        </p>

    </div>



    <!-- SHIPPING INFO -->

    <div class="card shadow p-4 mb-4">

        <h3 class="mb-3">

            Shipping Address 🚚

        </h3>

        <p id="shipping-info"></p>

    </div>



    <!-- PRODUCTS -->

    <div class="card shadow p-4">

        <h3 class="mb-4">

            Ordered Products 🛍️

        </h3>

        <div id="product-list">

        </div>

    </div>

</div>



<script>


// =========================
// GET ORDER ID FROM URL
// =========================

let path = window.location.pathname;

let orderId = path.split("/")[3];

console.log(orderId);


// =========================
// FETCH ORDER DETAILS
// =========================

fetch(`http://127.0.0.1:8000/account/orderdetails/api/${orderId}/`, {

    method: "GET",

    credentials: "include"

})

.then(res => res.json())

.then(data => {

    console.log(data);


    // =========================
    // ORDER INFO
    // =========================

    document.getElementById("order-id").innerText =
        data.order_id;

    document.getElementById("order-status").innerText =
        data.order_status;

    document.getElementById("total-amount").innerText =
        data.total_amount;



    // =========================
    // SHIPPING INFO
    // =========================

    let shipping =
        data.shipping_address;

    document.getElementById("shipping-info").innerHTML = `

        <strong>${shipping.full_name}</strong>
        <br>

        ${shipping.phone}
        <br>

        ${shipping.address}
        <br>

        ${shipping.city},
        ${shipping.district},
        ${shipping.state}

    `;



    // =========================
    // PRODUCTS
    // =========================

    let container =
        document.getElementById("product-list");

    container.innerHTML = "";


    data.products.forEach(product => {

        let card = `

            <div class="card mb-3">

                <div class="row g-0">

                    <div class="col-md-2">

                        <img
                            src="http://127.0.0.1:8000${product.product_image}"

                            class="img-fluid rounded-start"

                            style="
                                height:120px;
                                object-fit:cover;
                            ">

                    </div>


                    <div class="col-md-10">

                        <div class="card-body">

                            <h5>

                                ${product.product_name}

                            </h5>

                            <p>

                                Price:
                                ₹${product.price}

                            </p>

                            <p>

                                Quantity:
                                ${product.quantity}

                            </p>

                            <p>

                                Subtotal:
                                ₹${product.subtotal}

                            </p>

                        </div>

                    </div>

                </div>

            </div>

        `;

        container.innerHTML += card;

    });

});

</script>

</body>
</html>
