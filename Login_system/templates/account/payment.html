<!DOCTYPE html>
<html>

<head>

    <title>Payment - General Mart</title>

    <link
        href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css"
        rel="stylesheet">

</head>

<body class="bg-light">

<!-- NAVBAR -->

<nav class="navbar navbar-dark bg-dark px-4">

    <span class="navbar-brand">
        💳 General Mart Payment
    </span>

</nav>


<!-- PAYMENT SECTION -->

<div class="container mt-5">

    <div class="row justify-content-center">

        <div class="col-md-6">

            <div class="card shadow p-4">

                <h2 class="text-center mb-4">

                    Choose Payment Method 💰

                </h2>


                <!-- COD -->

                <div class="form-check mb-3">

                    <input class="form-check-input"
                           type="radio"
                           name="payment"
                           id="cod"
                           value="COD"
                           checked>

                    <label class="form-check-label"
                           for="cod">

                        Cash on Delivery (COD)

                    </label>

                </div>


                <!-- UPI -->

                <div class="form-check mb-3">

                    <input class="form-check-input"
                           type="radio"
                           name="payment"
                           id="upi"
                           value="UPI">

                    <label class="form-check-label"
                           for="upi">

                        UPI Payment

                    </label>

                </div>


                <!-- CARD -->

                <div class="form-check mb-3">

                    <input class="form-check-input"
                           type="radio"
                           name="payment"
                           id="card"
                           value="CARD">

                    <label class="form-check-label"
                           for="card">

                        Debit / Credit Card

                    </label>

                </div>


                <!-- UPI SECTION -->

                <div id="upi-box" style="display:none;">

                    <label class="form-label mt-3">
                        Enter UPI ID
                    </label>

                    <input type="text"
                           id="upi-id"
                           class="form-control"
                           placeholder="example@upi">

                </div>



                <!-- CARD SECTION -->

                <div id="card-box" style="display:none;">

                    <label class="form-label mt-3">
                        Card Number
                    </label>

                    <input type="text"
                           id="card-number"
                           class="form-control mb-3"
                           placeholder="1234 5678 9012 3456">


                    <label class="form-label">
                        Card Holder Name
                    </label>

                    <input type="text"
                           id="card-name"
                           class="form-control mb-3">


                    <div class="row">

                        <div class="col-md-6">

                            <label class="form-label">
                                Expiry
                            </label>

                            <input type="text"
                                   id="expiry"
                                   class="form-control"
                                   placeholder="MM/YY">

                        </div>


                        <div class="col-md-6">

                            <label class="form-label">
                                CVV
                            </label>

                            <input type="password"
                                   id="cvv"
                                   class="form-control"
                                   placeholder="123">

                        </div>

                    </div>

                </div>


                <!-- MESSAGE -->

                <p id="message"
                   class="text-center fw-bold mt-3">
                </p>


                <!-- BUTTON -->

                <button id="place-order-btn"
                        class="btn btn-success w-100 mt-3">

                    Place Order 🛍️

                </button>

            </div>

        </div>

    </div>

</div>


<script>

// =========================
// PAYMENT OPTION SWITCH
// =========================

let paymentOptions =
    document.querySelectorAll(
        'input[name="payment"]'
    );

paymentOptions.forEach(option => {

    option.addEventListener("change", function(){

        let selected = this.value;

        let upiBox =
            document.getElementById("upi-box");

        let cardBox =
            document.getElementById("card-box");

        // Hide all first
        upiBox.style.display = "none";
        cardBox.style.display = "none";

        // Show selected section
        if(selected === "UPI"){

            upiBox.style.display = "block";

        }

        else if(selected === "CARD"){

            cardBox.style.display = "block";

        }

    });

});



// =========================
// PLACE ORDER
// =========================

document.getElementById("place-order-btn")

.addEventListener("click", function(){

    let paymentMethod =
        document.querySelector(
            'input[name="payment"]:checked'
        ).value;

    console.log("PAYMENT:", paymentMethod);


    fetch("http://127.0.0.1:8000/account/placeorder/api/", {

        method: "POST",

        headers: {
            "Content-Type": "application/json"
        },

        credentials: "include",

        body: JSON.stringify({

            payment_method: paymentMethod

        })

    })

    .then(res => res.json())

    .then(data => {

        console.log(data);

        if(data.message){

    message.innerHTML = `

        <div class="alert alert-success">

            <h4>
                Order Placed Successfully ✅
            </h4>

            <p>
                Order ID:
                ${data.order_id}
            </p>

            <p>
                Total Amount:
                ₹${data.total_amount}
            </p>

            <button
                onclick="viewOrder(${data.order_id})"
                class="btn btn-primary mt-2">

                View Order 📦

            </button>

        </div>

    `;

}

        else{

            message.innerText =
                "Order Failed ❌";

            message.style.color = "red";

        }

    })

    .catch(error => {

        console.log(error);

    });

});
function viewOrder(orderId){

    window.location.href =
        `/account/orderdetails/${orderId}/`;

}

</script>

</body>
</html>
