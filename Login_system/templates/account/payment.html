<!-- templates/account/payment.html -->

<!DOCTYPE html>
<html>
<head>
    <title>Payment - General Mart</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        body {
            background: #f4f6f9;
        }
        .card {
            border-radius: 15px;
        }
        .card-header {
            background: linear-gradient(135deg, #667eea, #764ba2);
            color: white;
            border-radius: 15px 15px 0 0 !important;
        }
    </style>
</head>
<body>

<!-- Navbar -->
<nav class="navbar navbar-dark bg-dark px-4">
    <span class="navbar-brand">🛒 GeNeRaL MaRt</span>
    <a href="{% url 'dashboard' %}"
       class="btn btn-outline-light btn-sm">
        Dashboard 🏠
    </a>
</nav>

<!-- Messages -->
<div id="msg" class="container mt-2">
    {% if messages %}
        {% for message in messages %}
            <div class="alert alert-{{ message.tags }}">
                {{ message }}
            </div>
        {% endfor %}
    {% endif %}
</div>

<div class="container mt-4">
    <div class="row justify-content-center">
        <div class="col-md-5">
            <div class="card shadow">

                <!-- Card Header -->
                <div class="card-header p-4">
                    <h4 class="mb-0">💳 Payment Details</h4>
                    <small>GeNeRaL MaRt — Secure Payment</small>
                </div>

                <div class="card-body p-4">

                    <form method="POST">
                        {% csrf_token %}

                        <!-- Card Number -->
                        <div class="mb-3">
                            <label class="fw-bold">
                                Card Number
                            </label>
                            <input type="number"
                                   name="card_number"
                                   class="form-control form-control-lg"
                                   placeholder="1234 5678 9012 3456"
                                   maxlength="16">
                        </div>

                        <!-- Expiry & CVV -->
                        <div class="row">
                            <div class="col-md-6 mb-3">
                                <label class="fw-bold">
                                    Expiry Date
                                </label>
                                <input type="date"
                                       id="expiryDate"
                                       name="expiry"
                                       class="form-control form-control-lg"
                                       placeholder="MM/YY">
                            </div>

                            <div class="col-md-6 mb-3">
                                <label class="fw-bold">CVV</label>
                                <input type="password"
                                       name="cvv"
                                       class="form-control form-control-lg"
                                       placeholder="***"
                                       maxlength="3">
                            </div>
                        </div>

                        <!-- Name on Card -->
                        <div class="mb-4">
                            <label class="fw-bold">
                                Name on Card
                            </label>
                            <input type="text"
                                   name="card_name"
                                   class="form-control form-control-lg"
                                   value="{{ request.user.first_name }} {{ request.user.last_name }}">
                        </div>

                        <!-- Pay Button -->
                        <div class="d-grid">
                            <button type="submit"
                                    class="btn btn-success btn-lg">
                                Pay ₹{{ total }} Now 💳
                            </button>
                        </div>

                    </form>

                </div>

                <!-- Security Note -->
                <div class="card-footer text-center text-muted">
                    🔒 100% Secure Payment
                </div>

            </div>
        </div>
    </div>
</div>

<script>
    setTimeout(function() {
        var msg = document.getElementById('msg');
        if (msg) {
            msg.style.transition = 'opacity 1s';
            msg.style.opacity = '0';
            setTimeout(function() {
                msg.style.display = 'none';
            }, 1000);
        }
    }, 5000);


const expiryDate = document.getElementById("expiryDate");
    if (expiryDate) {
        const today = new Date().toISOString().split('T')[0];
        expiryDate.setAttribute("min", today);
    }
</script>
</script>

</body>
</html>
