{% extends 'base.html' %}

{% block title %}
Products
{% endblock %}

{% block css %}

<style>

body{
    background:#f5f5f5;
}

/* Navbar */

.navbar{
    padding:15px 20px;
}

.navbar-brand{
    font-size:24px;
    font-weight:bold;
}

/* Product Cards */

.card{
    border:none;
    border-radius:12px;
    overflow:hidden;
    transition:0.3s;
}

.card:hover{
    transform:translateY(-5px);
}

.card-img-top{
    object-fit:cover;
}

.card-body{
    text-align:center;
}

.card-title{
    font-weight:bold;
}

.price{
    color:green;
    font-weight:bold;
    font-size:18px;
}

.stock{
    color:gray;
    font-size:14px;
}

.btn-cart{
    width:100%;
}

</style>

{% endblock %}

{% block content %}

<!-- Navbar -->

<nav class="navbar navbar-dark bg-dark">

    <span class="navbar-brand">

        🛒 <span data-translate>Shoes Hub</span>

    </span>

    <div>

        <a href="{% url 'dashboard' %}"
        class="btn btn-outline-light btn-sm me-2"
        data-translate>

            Dashboard

        </a>

        <a href="{% url 'cart' %}"
        class="btn btn-outline-light btn-sm"
        data-translate>

            Wishlist

        </a>

    </div>

</nav>

<!-- Main Container -->

<div class="container mt-4">

    <h2 class="mb-4" data-translate>
        Products
    </h2>

    <div class="row" id="product-list">

    </div>

</div>

{% endblock %}

{% block js %}

<script>

window.addEventListener("DOMContentLoaded", function(){

    fetch("http://127.0.0.1:8001/account/product/api/",
    {
        method:"GET",
        credentials:"include"
    })

    .then(response => response.json())

    .then(function(data){

        let container =
        document.querySelector("#product-list");

        container.innerHTML = "";

        data.data.forEach(function(product){

            let card = `

            <div class="col-md-3 mb-4">

                <div class="card shadow">

                    <img src="${product.image}"
                    class="card-img-top"
                    height="220">

                    <div class="card-body">

                        <h5 class="card-title"
                        data-translate>

                            ${product.name}

                        </h5>

                        <p class="price">

                            ₹${product.price}

                        </p>

                        <p class="stock"
                        data-translate>

                            Stock: ${product.stock}

                        </p>

                        <button
                        onclick="addToCart(${product.id})"

                        class="btn btn-primary btn-cart"

                        data-translate>

                            Add to Cart 🛒

                        </button>

                        <p id="success-${product.id}"

                        style="
                        color:green;
                        margin-top:10px;
                        text-align:center;
                        ">

                        </p>

                    </div>

                </div>

            </div>

            `;

            container.innerHTML += card;

        });

        /* SAVE NEW TRANSLATABLE CONTENT */

        saveOriginals();

    });

});

async function addToCart(productId){

    let response = await fetch(

        "http://127.0.0.1:8001/account/cart/api/",

        {

            method:"POST",

            headers:{
                "Content-Type":"application/json"
            },

            credentials:"include",

            body:JSON.stringify({

                product:productId,
                quantity:1

            })

        }

    );

    let data = await response.json();

    console.log(data);

    document.getElementById(
        `success-${productId}`
    ).innerText = "Added to Cart";

}

</script>

{% endblock %}
