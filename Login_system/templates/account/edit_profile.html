<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Edit Profile - General Mart</title>

    <style>
        body {
            margin: 0;
            font-family: Arial, sans-serif;
            background: #f4f6f9;
        }

        /* Navbar */
        .navbar {
            background: #4facfe;
            padding: 15px 30px;
            color: white;
            display: flex;
            justify-content: space-between;
        }

        .logo {
            font-size: 22px;
            font-weight: bold;
        }

        .nav-links a {
            color: white;
            margin-left: 20px;
            text-decoration: none;
        }

        /* Container */
        .container {
            display: flex;
            justify-content: center;
            margin-top: 40px;
        }

        /* Card */
        .card {
            background: white;
            padding: 30px;
            width: 400px;
            border-radius: 10px;
            box-shadow: 0 5px 15px rgba(0,0,0,0.1);
        }

        .card h2 {
            text-align: center;
            margin-bottom: 20px;
        }

        label {
            font-weight: bold;
            font-size: 14px;
        }

        input, textarea {
            width: 100%;
            padding: 10px;
            margin: 8px 0 15px;
            border: 1px solid #ccc;
            border-radius: 5px;
            outline: none;
        }

        textarea {
            resize: none;
            height: 80px;
        }

        input:focus, textarea:focus {
            border-color: #4facfe;
        }

        button {
            width: 100%;
            padding: 10px;
            background: #4facfe;
            border: none;
            color: white;
            font-size: 16px;
            border-radius: 5px;
            cursor: pointer;
        }

        button:hover {
            background: #3a8ee6;
        }

        .messages p {
            text-align: center;
            color: green;
            font-size: 14px;
        }

    </style>
</head>
<body>

<!-- Navbar -->
<div class="navbar">
    <div class="logo">General<span>Mart</span></div>
    <div class="nav-links">
        <a href="{% url 'dashboard' %}">Dashboard</a>
        <a href="{% url 'profile' %}">View Profile</a>
        <a href="{% url 'logout' %}">Logout</a>
    </div>
</div>

<!-- Form Section -->
<div class="container">

    <div class="card">
        <h2>Edit Profile</h2>

        <!-- Messages -->
        <div class="messages">
            {% if messages %}
                {% for message in messages %}
                    <p>{{ message }}</p>
                {% endfor %}
            {% endif %}
        </div>

        <form method="POST">
            {% csrf_token %}

            <!-- User Table Fields -->
            <label>First Name</label>
            <input type="text" name="first_name" value="{{ request.user.first_name }}">

            <label>Last Name</label>
            <input type="text" name="last_name" value="{{ request.user.last_name }}">

            <label>Email</label>
            <input type="email" name="email" value="{{ request.user.email }}">

            <!-- Profile Table Fields -->
            <label>Phone</label>
            <input type="text" name="phone" value="{{ request.user.profile.phone }}">

            <label>Address</label>
            <textarea name="address">{{ request.user.profile.address }}</textarea>

            <button type="submit">Save Changes</button>

        </form>

    </div>

</div>

</body>
</html>
