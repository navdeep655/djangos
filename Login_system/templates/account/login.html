<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>General Mart - Login</title>
     <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0 /dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        body {
            margin: 0;
            font-family: Arial, sans-serif;
            background: linear-gradient(120deg, #4facfe, #00f2fe);
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
        }

        .container {
            background: white;
            padding: 30px 40px;
            border-radius: 10px;
            width: 350px;
            box-shadow: 0 10px 25px rgba(0,0,0,0.2);
        }

        .logo {
            text-align: center;
            font-size: 28px;
            font-weight: bold;
            margin-bottom: 5px;
        }

        .logo span {
            color: #4facfe;
        }

        .subtitle {
            text-align: center;
            font-size: 14px;
            margin-bottom: 20px;
            color: #555;
        }

        label {
            font-weight: bold;
            font-size: 14px;
        }

        input {
            width: 100%;
            padding: 10px;
            margin-top: 5px;
            margin-bottom: 15px;
            border: 1px solid #ccc;
            border-radius: 5px;
            outline: none;
            transition: 0.3s;
        }

        input:focus {
            border-color: #4facfe;
            box-shadow: 0 0 5px rgba(79,172,254,0.5);
        }

        button {
            width: 100%;
            padding: 10px;
            background: #4facfe;
            border: none;
            color: white;
            font-size: 16px;
            border-radius: 5px;
            cursor: pointer;
            transition: 0.3s;
        }

        button:hover {
            background: #3a8ee6;
        }

        .signup-link {
            text-align: center;
            margin-top: 15px;
            font-size: 14px;
        }

        .signup-link a {
            color: #4facfe;
            text-decoration: none;
            font-weight: bold;
        }

        .signup-link a:hover {
            text-decoration: underline;
        }


        @media (max-width: 400px) {
            .container {
                width: 90%;
                padding: 20px;
            }
        }
    </style>
</head>
<body>

<div class="container">

    <div class="logo"><span>GeNeRaL MaRt</span></div>
    <div class="subtitle"><b>Login to your account</b></div>

    <div id="msg">
    {% if messages %}
        {% for message in messages %}
            <div class="alert alert-{{ message.tags }}">
               {{ message }}
            </div>
        {% endfor %}
    {% endif %}
</div>

    <form method="POST">
        {% csrf_token %}

        <label for="username">Username</label>
        <input type="text" name="username"  placeholder="Enter username"  autocomplete="off">

        <label for="password">Password</label>
        <input type="password" name="password"  placeholder="Enter password" autocomplete="off">

        <button type="submit">Login</button>
    </form>

    <div class="signup-link">
        Don't have an account? 
        <a href="{% url 'signup' %}">Signup</a>
    </div>

</div>

</body>
<script>
    setTimeout(function() {
        var msg = document.getElementById('msg');
        if (msg) {
            // Smooth fade out!
            msg.style.transition = 'opacity 1s';
            msg.style.opacity    = '0';

            // Puri tarah hatao
            setTimeout(function() {
                msg.style.display = 'none';
            }, 1000);
        }
    }, 5000);
</script>

</html>
