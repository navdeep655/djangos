<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>General Mart - Login</title>
     <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0 /dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        body {
            margin: 0;
            font-family: Arial, sans-serif;
            background: linear-gradient(120deg, #4facfe, #00f2fe);
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
        }

        .container {
            background: white;
            padding: 30px 40px;
            border-radius: 10px;
            width: 350px;
            box-shadow: 0 10px 25px rgba(0,0,0,0.2);
        }

        .logo {
            text-align: center;
            font-size: 28px;
            font-weight: bold;
            margin-bottom: 5px;
        }

        .logo span {
            color: #4facfe;
        }

        .subtitle {
            text-align: center;
            font-size: 14px;
            margin-bottom: 20px;
            color: #555;
        }

        label {
            font-weight: bold;
            font-size: 14px;
        }

        input {
            width: 100%;
            padding: 10px;
            margin-top: 5px;
            margin-bottom: 15px;
            border: 1px solid #ccc;
            border-radius: 5px;
            outline: none;
            transition: 0.3s;
        }

        input:focus {
            border-color: #4facfe;
            box-shadow: 0 0 5px rgba(79,172,254,0.5);
        }

        button {
            width: 100%;
            padding: 10px;
            background: #4facfe;
            border: none;
            color: white;
            font-size: 16px;
            border-radius: 5px;
            cursor: pointer;
            transition: 0.3s;
        }

        button:hover {
            background: #3a8ee6;
        }

        .signup-link {
            text-align: center;
            margin-top: 15px;
            font-size: 14px;
        }

        .signup-link a {
            color: #4facfe;
            text-decoration: none;
            font-weight: bold;
        }

        .signup-link a:hover {
            text-decoration: underline;
        }


        @media (max-width: 400px) {
            .container {
                width: 90%;
                padding: 20px;
            }
        }
    </style>
</head>
<body>

<div class="container">

    <div class="logo"><span>GeNeRaL MaRt</span></div>
    <div class="subtitle"><b>Login to your account</b></div>

    <div id="msg">
    {% if messages %}
        {% for message in messages %}
            <div class="alert alert-{{ message.tags }}">
               {{ message }}
            </div>
        {% endfor %}
    {% endif %}
</div>
<p id ="success" style="color:green; text-align: center;"></p>
<p id ="error" style="color:red; text-align: center;"></p>

    <form method="POST">
        {% csrf_token %}

        <label for="username">Username</label>
        <input type="text" name="username"  placeholder="Enter username"  autocomplete="off">

        <label for="password">Password</label>
        <input type="password" name="password"  placeholder="Enter password" autocomplete="off">

        <button type="submit">Login</button>
    </form>

    <div class="signup-link">
        Don't have an account? 
        <a href="{% url 'signup' %}">Signup</a>
    </div>

</div>

</body>
<script>
document.querySelector("form").addEventListener('submit',function(e) {e.preventDefault()
    let username=document.querySelector('input[name="username"]').value
    let password=document.querySelector('input[name="password"]').value
    if (username==""&& password=="")
{
    document.querySelector("#error").innerText="Please Enter the Credentials"
}
   else if (username=="")
{
    document.querySelector("#error").innerText="Please Enter the username"
}
  else if (password=="")
{
    document.querySelector("#error").innerText="Please Enter the password"
}

    fetch("http://127.0.0.1:8000/account/login/api/",
    {
        method:'POST',
        headers:{"Content-Type":"application/json" },
        body:JSON.stringify({
        username:username,
        password:password
        })
    })
    .then(function(response)
     {
        return response.json()
     })
   .then(function(data){
    console.log(data)
        if (data.message)
    {
         document.querySelector("#success").innerText=data.message
         window.location.href="/account/dashboard/"
         document.querySelector("#error").innerText=""

    }
    else if (data.error)
    {
        document.querySelector("#error").innerText=data.error
    }
    })


    })
</script>

</html>
