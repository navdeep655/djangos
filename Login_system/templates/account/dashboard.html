{% load static %} 
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>General Mart - Dashboard</title>

    <style>
        body {
            margin: 0;
            font-family: Arial, sans-serif;
            background-color: #f4f6f9;
        }

        /* Navbar */
        .navbar{
    position:fixed;
    top:0;
    left:0;
    width:100%;
    background:#4f46e5;
    padding:18px 0px;
    display:flex;
    justify-content:space-between;
    align-items:center;
    box-shadow:0 4px 15px rgba(0,0,0,0.1);
    z-index:1000;
}

.logo{
    color:white;
    font-size:24px;
    font-weight:bold;
}

.logo span{
    color:#ffd700;
}

.nav-links{
    display:flex;
    gap:0px;
    margin-left:auto; 
}

.nav-links a{
    color:white;
    text-decoration:none;
    font-weight:500;
    transition:0.3s;
}

.nav-links a:hover{
    color:#ffd700;
}

        /* Container */
        .container {
            padding: 30px;
        }

        .welcome {
            font-size: 22px;
            margin-bottom: 20px;
        }

        /* Cards */
        .cards {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(220px, 1fr));
            gap: 20px;
        }

        .card {
            background: white;
            padding: 20px;
            border-radius: 10px;
            box-shadow: 0 5px 15px rgba(0,0,0,0.1);
            transition: 0.3s;
        }

        .card:hover {
            transform: translateY(-5px);
        }

        .card h3 {
            margin: 0;
            font-size: 18px;
            color: #333;
        }

        .card p {
            margin: 10px 0 0;
            font-size: 14px;
            color: #777;
        }

        .btn {
            display: inline-block;
            margin-top: 10px;
            padding: 8px 12px;
            background: #4facfe;
            color: white;
            text-decoration: none;
            border-radius: 5px;
            font-size: 13px;
        }

        .btn:hover {
            background: #3a8ee6;
        }
        .nav-logout{
            color:white;
            text-decoration:none;
            font-weight:500;
            transition:0.3s;
        }

        .nav-logout:hover{
            color:#ffd700;
        }

    </style>
</head>
<body>
 
<!-- Navbar -->
<div class="navbar">
    <div class="logo">General<span>Mart</span>
    </div>
    <div class="nav-links">
      <a href="#" id="logout-btn" class="nav-logout">Logout</a>
    </div>
</div>
<br> <br> <br>
<!-- Main Content -->
<div class="container">

    <div class="welcome">
        Welcome, {{ request.user.username }} 
    </div>

    <div class="cards">

        <div class="card">
            <h3>🛒 My Orders</h3>
            <p>View and track your orders</p>
            <a href="/account/orderdetails/{{ latest_order.id }}/"
            class="btn">
                View Orders
            </a>
        </div>

        <div class="card">
            <h3>👤 Profile</h3>
            <p>Manage your account details</p>
            <a href="{%url 'profile'%}" class="btn">View Profile</a>
        </div>

        <div class="card">
            <h3>🛍 Products</h3>
            <p> Choose items here</p>
            <a href="{% url 'product' %}"class="btn">Products</a>
        </div>

        <div class="card">
            <h3>❤️ Wishlist</h3>
            <p>Products you saved</p>
            <a href="{%url 'cart'%}" class="btn">View Wishlist</a>
        </div>

    </div>

</div>
<script>
    document.querySelector("#logout-btn").addEventListener ('click',function(e) {e.preventDefault()
        fetch("http://127.0.0.1:8000/account/logout/api/",
            {
                method:"POST",
                headers:{"Content-Type":"application/json"},
                credentials:"include",
            })
            .then(function(response){
                return response.json()
            })
            .then(function(data){
                 console.log(data)  
                if (data.message){
                    window.location.href="/account/login/"
                }
                else{
                     window.location.href="/account/login/"
                }
            })
    })
</script>
</body>
</html>
