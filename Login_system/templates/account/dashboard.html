{% load static %} 
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>General Mart - Dashboard</title>

    <style>
        body {
            margin: 0;
            font-family: Arial, sans-serif;
            background-color: #f4f6f9;
        }

        /* Navbar */
        .navbar {
            background: #4facfe;
            padding: 15px 30px;
            color: white;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .logo {
            font-size: 22px;
            font-weight: bold;
        }

        .logo span {
            color: #fff;
        }

        .nav-links a {
            color: white;
            text-decoration: none;
            margin-left: 20px;
            font-size: 14px;
        }

        .nav-links a:hover {
            text-decoration: underline;
        }

        /* Container */
        .container {
            padding: 30px;
        }

        .welcome {
            font-size: 22px;
            margin-bottom: 20px;
        }

        /* Cards */
        .cards {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(220px, 1fr));
            gap: 20px;
        }

        .card {
            background: white;
            padding: 20px;
            border-radius: 10px;
            box-shadow: 0 5px 15px rgba(0,0,0,0.1);
            transition: 0.3s;
        }

        .card:hover {
            transform: translateY(-5px);
        }

        .card h3 {
            margin: 0;
            font-size: 18px;
            color: #333;
        }

        .card p {
            margin: 10px 0 0;
            font-size: 14px;
            color: #777;
        }

        .btn {
            display: inline-block;
            margin-top: 10px;
            padding: 8px 12px;
            background: #4facfe;
            color: white;
            text-decoration: none;
            border-radius: 5px;
            font-size: 13px;
        }

        .btn:hover {
            background: #3a8ee6;
        }

    </style>
</head>
<body>
 
<!-- Navbar -->
<div class="navbar">
    <div class="logo"><span>GeNeRaL MaRt</span></div>
    <div class="nav-links">
        <a href="{% url 'logout' %}">Logout</a>
    </div>
</div>

<!-- Main Content -->
<div class="container">

    <div class="welcome">
        Welcome, {{ request.user.username }} 👋
    </div>

    <div class="cards">

        <div class="card">
            <h3>🛒 My Orders</h3>
            <p>View and track your orders</p>
            <a href="#" class="btn">View Orders</a>
        </div>

        <div class="card">
            <h3>👤 Profile</h3>
            <p>Manage your account details</p>
            <a href="{%url 'profile'%}" class="btn">View Profile</a>
        </div>

        <div class="card">
            <h3>🛍 Products</h3>
            <p> Choose items here</p>
            <a href="{% url 'product' %}"class="btn">Products</a>
        </div>

        <div class="card">
            <h3>❤️ Wishlist</h3>
            <p>Products you saved</p>
            <a href="{%url 'cart'%}" class="btn">View Wishlist</a>
        </div>

    </div>

</div>

</body>
</html>
